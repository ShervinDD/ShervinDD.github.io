<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shervin D'Aguiar</title>
  <meta name="description" content="Official website of Shervin D'Aguiar.">

  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe6;
      --line: rgba(244, 239, 230, 0.22);
      --panel: rgba(11, 9, 7, 0.38);
      --panel-strong: rgba(244, 239, 230, 0.94);
      --ground: #060504;
      --amber: #d7a45b;
      --button-glass: rgba(14, 12, 10, 0.56);
      --button-edge: rgba(215, 164, 91, 0.42);
      --button-glow: rgba(215, 164, 91, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        linear-gradient(90deg, rgba(6, 5, 4, 0.96), rgba(6, 5, 4, 0.72) 50%, rgba(6, 5, 4, 0.94)),
        linear-gradient(180deg, #18100b 0%, #060504 58%, #030302 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image:
        linear-gradient(rgba(244, 239, 230, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 239, 230, 0.1) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(180deg, transparent, #000 24%, #000 82%, transparent);
    }

    a {
      color: inherit;
    }

    .studio-art {
      position: fixed;
      right: -8vw;
      bottom: -5vh;
      width: min(48rem, 62vw);
      height: auto;
      pointer-events: none;
      opacity: 0.18;
      filter: blur(0.3px);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 2rem;
      padding: 1.4rem;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: rgba(244, 239, 230, 0.72);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
    }

    .mark::before {
      content: "";
      width: 0.58rem;
      height: 0.58rem;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 0.38rem rgba(215, 164, 91, 0.12);
    }

    .hero {
      width: min(100%, 74rem);
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: start;
      padding: 4rem 0;
    }

    h1 {
      margin: 0;
      max-width: 8ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.05rem;
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: 0;
      text-wrap: balance;
    }

    h1 span {
      display: block;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.45rem;
      margin-top: 2.4rem;
    }

    .link-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 14.75rem;
      min-height: 4.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.05rem 2.05rem;
      border: 1px solid var(--button-edge);
      border-radius: 999px;
      background:
        radial-gradient(circle at 25% 0%, rgba(244, 239, 230, 0.14), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.018)),
        var(--button-glass);
      color: var(--ink);
      font-size: 1.18rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      text-decoration: none;
      white-space: nowrap;
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 rgba(215, 164, 91, 0.1),
        0 1.15rem 2.8rem rgba(0, 0, 0, 0.32),
        0 0 0 1px rgba(215, 164, 91, 0.08),
        0 0 2.2rem rgba(215, 164, 91, 0.11);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease,
        box-shadow 180ms ease,
        color 180ms ease;
    }

    .link-button::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: inherit;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, 0.18), transparent 26%, transparent 68%, rgba(215, 164, 91, 0.16)),
        radial-gradient(circle at 50% 115%, rgba(215, 164, 91, 0.3), transparent 54%);
      opacity: 0.6;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .link-button::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 0;
      z-index: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 221, 171, 0.88), transparent);
      box-shadow: 0 0 1rem rgba(215, 164, 91, 0.68);
      opacity: 0.72;
      pointer-events: none;
      transition: opacity 180ms ease, left 180ms ease, right 180ms ease;
    }

    .link-button svg,
    .link-button span {
      position: relative;
      z-index: 1;
    }

    .link-button svg {
      width: 1.55rem;
      height: 1.55rem;
      flex: 0 0 auto;
      color: #f8dfb1;
      filter: drop-shadow(0 0 0.45rem rgba(215, 164, 91, 0.42));
      stroke-width: 2;
    }

    .link-button:hover,
    .link-button:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(248, 223, 177, 0.72);
      background:
        radial-gradient(circle at 25% 0%, rgba(244, 239, 230, 0.18), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03)),
        rgba(18, 15, 12, 0.68);
      color: #fff7ec;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 1.2rem rgba(215, 164, 91, 0.08),
        0 1.4rem 3.4rem rgba(0, 0, 0, 0.38),
        0 0 0 1px rgba(215, 164, 91, 0.12),
        0 0 2.7rem rgba(215, 164, 91, 0.24);
      outline: none;
    }

    .link-button:hover::before,
    .link-button:focus-visible::before {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .link-button:hover::after,
    .link-button:focus-visible::after {
      left: 12%;
      right: 12%;
      opacity: 1;
    }

    .link-button:focus-visible {
      outline: 2px solid rgba(248, 223, 177, 0.62);
      outline-offset: 4px;
    }

    .footer {
      align-items: flex-end;
    }

    .footer-line {
      width: min(32vw, 20rem);
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 380px) {
      h1 {
        font-size: 3.45rem;
      }
    }

    @media (min-width: 720px) {
      .page {
        padding: 2.1rem;
      }

      .topbar,
      .footer {
        font-size: 0.9rem;
      }

      h1 {
        font-size: 5.55rem;
      }

      .link-row {
        margin-top: 3rem;
      }
    }

    @media (min-width: 1120px) {
      .page {
        padding: 3rem;
      }

      h1 {
        font-size: 7.4rem;
      }
    }

    @media (max-width: 520px) {
      .studio-art {
        width: 44rem;
        right: -26rem;
        bottom: 10vh;
        opacity: 0.12;
      }

      .hero {
        justify-items: stretch;
        padding: 3rem 0;
      }

      .link-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .link-button {
        width: 100%;
        min-width: 0;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-line {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <svg class="studio-art" aria-hidden="true" viewBox="0 0 720 860" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M376 170c44 0 80 36 80 80v190c0 44-36 80-80 80s-80-36-80-80V250c0-44 36-80 80-80Z" stroke="#f4efe6" stroke-width="34"/>
    <path d="M214 392v46c0 90 72 162 162 162s162-72 162-162v-46" stroke="#d7a45b" stroke-width="28" stroke-linecap="round"/>
    <path d="M376 600v122" stroke="#f4efe6" stroke-width="26" stroke-linecap="round"/>
    <path d="M286 722h180" stroke="#f4efe6" stroke-width="26" stroke-linecap="round"/>
    <path d="M124 102h482M84 242h560M66 382h590M96 522h528M146 662h430" stroke="#f4efe6" stroke-width="2" opacity="0.42"/>
  </svg>

  <div class="page">
    <header class="topbar" aria-label="Site header">
      <a class="mark" href="/" aria-label="Shervin D'Aguiar home">Shervin D'Aguiar</a>
    </header>

    <main class="hero">
      <h1>
        <span>Shervin</span>
        <span>D'Aguiar</span>
      </h1>

      <nav class="link-row" aria-label="Social links">
        <h2 class="sr-only">Social links</h2>

        <a class="link-button" href="https://www.instagram.com/shervindaguiar/" target="_blank" rel="noopener" title="Open Instagram">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
          </svg>
          <span>Instagram</span>
        </a>

        <a class="link-button" href="https://www.youtube.com/@Access_Dubai" target="_blank" rel="noopener" title="Open podcast">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" x2="12" y1="19" y2="22"></line>
          </svg>
          <span>Podcast</span>
        </a>
      </nav>
    </main>

    <footer class="footer">
      <span>Copyright &copy; 2026 Shervin D'Aguiar</span>
      <span class="footer-line" aria-hidden="true"></span>
    </footer>
  </div>
</body>
</html>
