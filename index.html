<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shervin D'Aguiar</title>
  <meta name="description" content="Official website of Shervin D'Aguiar.">

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #f7f7f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      width: 100%;
      max-width: 680px;
      background: white;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      margin: 0 0 12px;
      letter-spacing: -0.04em;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #444;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .links a {
      color: #111;
      text-decoration: none;
      border: 1px solid #ddd;
      padding: 10px 16px;
      border-radius: 999px;
    }

    .links a:hover {
      background: #111;
      color: white;
    }

    footer {
      margin-top: 36px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Shervin D'Aguiar</h1>

    <p>
      Welcome to my personal website.
    </p>

    <section aria-label="Social links">
      <h2>Social</h2>

      <div class="links">
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://x.com/" target="_blank" rel="noopener">X</a>
        <a href="mailto:hello@shervindaguiar.com">Email</a>
      </div>
    </section>

    <footer>
      Copyright © 2026 Shervin D'Aguiar. All rights reserved.
    </footer>
  </main>
</body>
</html>
